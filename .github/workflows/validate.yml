name: validate-and-build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: secondChance-backend/package-lock.json
      - run: npm ci --prefix secondChance-backend
      - run: npm test --prefix secondChance-backend
      - run: node --check secondChance-backend/app.js && node --check secondChance-backend/routes/authRoutes.js && node --check secondChance-backend/routes/secondChanceItemsRoutes.js && node --check secondChance-backend/routes/searchRoutes.js

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: secondChance-frontend/package-lock.json
      - run: npm ci --prefix secondChance-frontend
      - run: npm run build --prefix secondChance-frontend
        env:
          CI: "true"

  sentiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sentiment/package-lock.json
      - run: npm ci --prefix sentiment
      - run: npm test --prefix sentiment
      - run: docker build -t secondchance-sentiment ./sentiment
      - run: docker build -t secondchance-app -f secondChance-backend/Dockerfile .