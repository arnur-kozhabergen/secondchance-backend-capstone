services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 15

  seed:
    build:
      context: .
      dockerfile: secondChance-backend/Dockerfile
    command: ["node", "util/import-mongo/index.js"]
    environment:
      MONGO_URL: mongodb://mongodb:27017
      MONGO_DB: secondChance
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: secondChance-backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URL: mongodb://mongodb:27017
      MONGO_DB: secondChance
      PORT: 3060
    volumes:
      - item-uploads:/app/secondChance-backend/public/uploads
    ports:
      - "127.0.0.1:3060:3060"
    depends_on:
      mongodb:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  sentiment:
    build: ./sentiment
    restart: unless-stopped
    environment:
      PORT: 3000
    ports:
      - "127.0.0.1:3001:3000"

volumes:
  mongo-data:
  item-uploads:
